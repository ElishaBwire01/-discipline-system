repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: detect-private-key

  # detect-secrets is intentionally run in CI only; local runs may fail due to environment differences

  - repo: local
    hooks:
      - id: scan-hardcoded-keys
        name: Scan for hardcoded API keys
        entry: python scripts/scan_for_hardcoded_keys.py
        language: system
        files: '\\.(py|env|sh|yaml|yml|json|txt)$'
