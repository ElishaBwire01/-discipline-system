<div class="mb-3">
    <label class="form-label-modern">Category</label>
    <select name="category" class="form-control-modern" id="reportCategory" onchange="toggleCustomCase()">
        <option value="">-- Select Category --</option>
        {% for category in categories %}
        <option value="{{ category.id }}">{{ category.name }}</option>
        {% endfor %}
        <option value="custom">Custom Case</option>
    </select>
</div>
<div id="customCaseContainer" style="display: none;">
    <div class="mb-3">
        <label class="form-label-modern">Custom Case Description</label>
        <textarea name="custom_case" class="form-control-modern" rows="3" placeholder="Describe the custom offense..."></textarea>
    </div>
</div>
<div class="mb-3">
    <label class="form-label-modern">Rating</label>
    <select name="rating" class="form-control-modern">
        <option value="VERY_MINOR">Very Minor</option>
        <option value="MINOR">Minor</option>
        <option value="MODERATE" selected>Moderate</option>
        <option value="SERIOUS">Serious</option>
        <option value="VERY_SERIOUS">Very Serious</option>
    </select>
</div>
<div class="mb-3">
    <label class="form-label-modern">Comments</label>
    <textarea name="comments" class="form-control-modern" rows="3" placeholder="Additional comments..."></textarea>
</div>
<script>
function toggleCustomCase() {
    var category = document.getElementById('reportCategory');
    var customContainer = document.getElementById('customCaseContainer');
    if (category.value === 'custom') {
        customContainer.style.display = 'block';
    } else {
        customContainer.style.display = 'none';
    }
}
</script>
