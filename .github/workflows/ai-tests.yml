name: AI Integration Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ai-tests:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      POLLINATION_API_KEY: ${{ secrets.POLLINATION_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pre-commit detect-secrets requests

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

      - name: Run AI integration test
        run: python -m scripts.ai_integration_test

      - name: Run AI smoke tests
        run: python -m scripts.ai_smoke_tests
